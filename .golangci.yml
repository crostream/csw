version: "2"

linters:
  default: standard
  enable:
    - gochecknoinits
    - revive
    - errorlint
    - errname
    - nilnil
    - nilerr
    - usestdlibvars
    - intrange
    - prealloc
    - bodyclose
    - containedctx
    - fatcontext
    - contextcheck
    - unconvert
    - wastedassign
    - misspell
    - unparam
    - godot
    - whitespace
    - funlen
    - cyclop
    - gosec
  settings:
    funlen:
      lines: 120
      statements: 80
    cyclop:
      max-complexity: 20
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocyclo
          - unparam
          - funlen
          - cyclop

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
